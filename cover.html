<body class="cover-page">
<div id="loader" aria-hidden="true">
  <div class="loader-inner">
    <p class="loader-line">Preparing something special for you…</p>
    <h1 class="loader-title">RAI FOREVER</h1>

<div class="grain" aria-hidden="true"></div>

<main id="main">
  <section id="home" class="hero">
    <div class="hero-bg" id="hero-bg" aria-hidden="true"></div>
    <img class="hero-photo" id="hero-photo" src="" alt="" aria-hidden="true" fetchpriority="high" decoding="async">
    <div class="hero-veil"></div>
    <canvas id="particles" class="hero-particles" aria-hidden="true"></canvas>

    <div class="hero-content">
      <p class="hero-eyebrow reveal-text">A private story, for one reader</p>
      <h1 class="hero-title">
        <span class="reveal-text hero-title-main" style="--d:0.05s">RAI</span>
        <span class="reveal-text hero-title-script" style="--d:0.2s">FOREVER</span>
      </h1>
      <div class="hero-details">
        <p class="hero-tagline reveal-text" style="--d:0.4s">“All is only for you.”</p>
        <p class="hero-support reveal-text" style="--d:0.55s">Some stories are written in books.<br>Ours is written in moments.</p>
        <a href="/story" class="btn btn-outline hero-cta reveal-text" aria-label="Enter our story" style="--d:0.75s">
          <svg class="heart-svg" viewBox="0 0 200 175" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
            <path d="M100 158C84 144 14 112 14 61C14 32 33 15 58 15C72 15 84 22 92 34C95 39 98 46 100 50C102 46 105 39 108 34C116 22 128 15 142 15C167 15 186 32 186 61C186 112 116 144 100 158Z"/>
          </svg>
          <span class="heart-button-text">ENTER OUR STORY</span>
        </a>
      </div>
    </div>
  </section>
